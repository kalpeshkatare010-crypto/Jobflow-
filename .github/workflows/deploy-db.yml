name: Deploy database

# Applies new files in supabase/migrations to your Supabase project.
# Runs when migrations change on main, or by hand from the Actions tab.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   - the id in your project URL (https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   - the database password chosen when creating the project
# If they are not set, the job stops with a message and changes nothing.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check settings
        id: settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets are not set yet; nothing was deployed. See docs/SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.settings.outputs.ready == 'true'
        with:
          # Pinned: Supabase CLI 3 changed its flags; update deliberately, not by surprise.
          version: 3.2.0
      - name: Apply migrations
        if: steps.settings.outputs.ready == 'true'
        run: |
          supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
